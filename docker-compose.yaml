services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=chat
      - DB_USER=chat-user
      - DB_PASSWORD=my-secret
      - DB_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
    volumes:
      - node_modules:/app/node_modules
      - ./ai:/app/ai
      - ./app:/app/app
      - ./components:/app/components
      - ./drizzle:/app/drizzle
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./public:/app/public
    networks:
      - chat

  postgres:
    image: postgres:15
    ports:
      - "5432:5432" 
    environment:
      - POSTGRES_USER=chat-user
      - POSTGRES_PASSWORD=my-secret
      - POSTGRES_DB=chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat
  mcp-server:
    image: dadosfera/mcp-server
    ports:
      - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - DADOSFERA_USERNAME=${DADOSFERA_USERNAME}
      - DADOSFERA_PASSWORD=${DADOSFERA_PASSWORD}
    networks:
      - chat
  mcp-snowflake:
    image: dadosfera/mcp-snowflake
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - chat


volumes:
  postgres_data:
  node_modules:
networks:
  chat:
    driver: bridge
